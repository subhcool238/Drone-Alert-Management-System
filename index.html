<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlytBase Security Ops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script>
        window.tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#06b6d4",
                        secondary: "#0f172a",
                        danger: "#ef4444",
                        warning: "#f97316",
                        success: "#10b981",
                        background: "#0b0e14",
                        panel: "#151a23",
                        border: "#334155",
                        "text-muted": "#94a3b8"
                    },
                    fontFamily: {
                        sans: ['"Inter Variable"', 'Inter', 'system-ui', 'sans-serif'],
                        display: ['"Space Grotesk Variable"', '"Space Grotesk"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono Variable"', '"JetBrains Mono"', 'ui-monospace', 'monospace']
                    },
                    animation: {
                        'scan': 'scan 3s linear infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(500%)' },
                        }
                    }
                }
            }
        };
    </script>
    <style>
        @layer base {
            body { @apply bg-background text-gray-100 font-body antialiased; }
            ::-webkit-scrollbar { width: 4px; height: 4px; }
            ::-webkit-scrollbar-track { @apply bg-transparent; }
            ::-webkit-scrollbar-thumb { @apply bg-gray-800 rounded-full; }
            ::-webkit-scrollbar-thumb:hover { @apply bg-gray-700; }
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .fill-1 { font-variation-settings: 'FILL' 1; }
        /* Digits keep a fixed width so ticking values do not jump */
        .font-mono, .tabular-nums { font-variant-numeric: tabular-nums; }
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { @apply bg-white/10 rounded-full; }
    </style>
</head>
<body class="bg-background text-gray-100 font-sans text-sm antialiased">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
